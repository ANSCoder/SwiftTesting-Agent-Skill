  <text x="30" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#F2F2F7">Swift<tspan fill="#F05138">Testing</tspan></text>
