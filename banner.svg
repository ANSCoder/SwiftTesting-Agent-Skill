  <text x="358" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3E3E52">after</text>
  <text x="490" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#F05138">#expect(a == b)</text>

  <rect x="346" y="153" width="318" height="22" rx="4" fill="#BF8AF0" fill-opacity="0.08" stroke="#BF8AF0" stroke-width="0.4" stroke-opacity="0.3"/>
  <text x="358" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3E3E52">after</text>
  <text x="490" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#BF8AF0">confirmation { confirm in }</text>

  <rect x="346" y="176" width="318" height="20" rx="4" fill="#5AC8FA" fill-opacity="0.08" stroke="#5AC8FA" stroke-width="0.4" stroke-opacity="0.3"/>
