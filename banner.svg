  <text x="358" y="65" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3E3E52">before</text>
  <text x="490" y="65" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3E3E52" text-decoration="line-through">XCTestExpectation()</text>

  <rect x="346" y="80" width="318" height="26" rx="5" fill="#0F0F18" stroke="#1F1F2E" stroke-width="0.5"/>
  <text x="358" y="97" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3E3E52">before</text>
  <text x="490" y="97" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3E3E52" text-decoration="line-through">class Tests: XCTestCase</text>

  <line x1="346" y1="118" x2="660" y2="118" stroke="#2A2A3E" stroke-width="0.75" stroke-dasharray="3 3"/>

