  <text x="30" y="132" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#6E6E82">Teach AI agents to write modern Swift tests.</text>
  <text x="30" y="149" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#6E6E82">Stop generating XCTest. Start generating</text>
  <text x="30" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <tspan fill="#BF8AF0">@Test</tspan>
    <tspan fill="#6E6E82">, </tspan>
    <tspan fill="#F05138">#expect</tspan>
    <tspan fill="#6E6E82">, </tspan>
    <tspan fill="#5AC8FA">async throws</tspan>
    <tspan fill="#6E6E82">.</tspan>
  </text>

  <rect x="30" y="177" width="52" height="17" rx="3" fill="#1A1A26" stroke="#2A2A3E" stroke-width="0.5"/>
  <text x="56" y="189" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#6E6E82" text-anchor="middle">Codex</text>

