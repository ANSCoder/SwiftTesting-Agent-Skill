  <line x1="330" y1="0" x2="330" y2="200" stroke="#1F1F2E" stroke-width="0.75"/>
  <rect x="330" y="0" width="350" height="200" fill="#13131A"/>

  <rect x="346" y="16" width="318" height="26" rx="5" fill="#0F0F18" stroke="#1F1F2E" stroke-width="0.5"/>
  <text x="358" y="33" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3E3E52">before</text>
  <text x="490" y="33" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#3E3E52" text-decoration="line-through">XCTAssertEqual(a, b)</text>

